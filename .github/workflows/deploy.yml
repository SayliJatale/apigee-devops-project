name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Authenticate to Google Cloud
    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 3️⃣ Set up gcloud SDK
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 4️⃣ Install dependencies + apigeecli
    - name: Install dependencies and apigeecli
      run: |
        sudo apt-get update && sudo apt-get install -y jq unzip zip curl
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        chmod +x download.sh
        ./download.sh
        # Persist PATH across steps
        echo "PATH=$HOME/.apigeecli/bin:$PATH" >> $GITHUB_ENV

    # 5️⃣ Prepare proxy bundle
    - name: Prepare proxy bundle
      run: |
        if [ ! -f "./apiproxy.zip" ]; then
          echo "Zipping proxy folder..."
          zip -r apiproxy.zip ./apiproxy
        fi
        echo "Contents of proxy bundle:"
        unzip -l ./apiproxy.zip

    # 6️⃣ Validate proxy bundle
    - name: Validate proxy bundle
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        echo "Validating API proxy bundle..."
        VALIDATE_OUTPUT=$(apigeecli apis validate -f ./apiproxy.zip -o $ORG --default-token 2>&1 || true)
        echo "$VALIDATE_OUTPUT"
        if echo "$VALIDATE_OUTPUT" | grep -i "error"; then
          echo "❌ Proxy bundle validation failed"
          exit 1
        fi
        echo "✅ Proxy bundle is valid"

    # 7️⃣ Import API proxy via apigeecli
    - name: Import API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        API_NAME="demoapi"
        echo "Importing API proxy..."
        IMPORT_RESPONSE=$(apigeecli apis import -f ./apiproxy.zip -o $ORG --default-token 2>&1 || true)
        echo "Raw import response:"
        echo "$IMPORT_RESPONSE"

        REVISION=$(echo "$IMPORT_RESPONSE" | jq -r '.revision // empty')
        if [ -z "$REVISION" ]; then
          echo "❌ Failed to detect revision from import."
          exit 1
        fi

        echo "Imported revision: $REVISION"
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    # 8️⃣ Deploy API proxy via apigeecli
    - name: Deploy API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        ENV="${{ secrets.APIGEE_ENV }}"
        API_NAME="demoapi"

        if [ -z "$REVISION" ]; then
          echo "❌ REVISION not set. Cannot deploy."
          exit 1
        fi

        echo "Deploying revision $REVISION to environment $ENV..."
        DEPLOY_RESPONSE=$(apigeecli apis deploy -n $API_NAME -e $ENV -o $ORG --rev $REVISION --default-token 2>&1 || true)
        echo "Deployment response:"
        echo "$DEPLOY_RESPONSE"

        if echo "$DEPLOY_RESPONSE" | grep -i "error"; then
          echo "❌ Deployment failed."
          exit 1
        fi

        echo "✅ Deployment complete!"
