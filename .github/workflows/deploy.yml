name: Apigee CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest

    env:
      APIGEE_ORG: ${{ secrets.APIGEE_ORG }}
      APIGEE_PROJECT: ${{ secrets.APIGEE_PROJECT }}
      API_NAME: demoapi

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    - name: Install required tools
      run: |
        sudo apt-get update && sudo apt-get install -y \
          jq curl unzip zip libxml2-utils

    - name: Download Apigee CLI
      run: |
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        bash download.sh
        export PATH=$PATH:$HOME/.apigeecli/bin

    - name: Validate and Import API proxy
      run: |
        API_FOLDER="$GITHUB_WORKSPACE/apiproxies/$API_NAME"
        echo "=============================="
        echo "Processing API proxy: $API_NAME"
        echo "=============================="

        echo "Checking contents of API folder..."
        ls -R "$API_FOLDER"

        echo "Validating XML files..."
        find "$API_FOLDER" -name "*.xml" -exec xmllint --noout {} \;

        echo "Getting access token..."
        TOKEN=$(gcloud auth print-access-token)

        echo "Importing API proxy via Apigee CLI from folder..."
        IMPORT_RESPONSE=$(apigeecli apis import -f "$API_FOLDER" --org "$APIGEE_ORG" --token "$TOKEN" 2>&1 || true)

        echo "Raw import output:"
        echo "$IMPORT_RESPONSE"

        REVISION=$(echo "$IMPORT_RESPONSE" | jq -r '.revision // empty')
        if [ -z "$REVISION" ]; then
          echo "❌ Import failed! Check API proxy folder contents or raw output above."
          exit 1
        fi

        echo "✅ Imported revision: $REVISION"
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    - name: Success message
      run: |
        echo "API proxy imported successfully. Revision: $REVISION"
