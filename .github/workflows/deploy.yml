name: Apigee X CI/CD

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  APIGEE_ORG: ${{ secrets.APIGEE_ORG }}
  APIGEE_ENV: ${{ secrets.APIGEE_ENV }}
  PROXY_NAME: demoapi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Authenticate to GCP using service account JSON
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set gcloud project
      run: gcloud config set project $PROJECT_ID

    - name: Get access token
      id: token
      run: |
        TOKEN=$(gcloud auth print-access-token)
        echo "TOKEN=$TOKEN" >> $GITHUB_ENV

    # ZIP the proxy correctly (IMPORTANT)
    - name: Create proxy bundle zip
      run: |
        cd apiproxy
        zip -r ../proxy.zip ./*
        cd ..

    # IMPORT proxy
    - name: Import proxy
      run: |
        echo "Importing proxy..."

        RESPONSE=$(curl -s -X POST \
        "https://apigee.googleapis.com/v1/organizations/$APIGEE_ORG/apis?action=import&name=$PROXY_NAME" \
        -H "Authorization: Bearer $TOKEN" \
        -H "Content-Type: multipart/form-data" \
        -F "file=@proxy.zip")

        echo "====== IMPORT RESPONSE ======"
        echo "$RESPONSE"

        REVISION=$(echo $RESPONSE | jq -r '.revision')
        echo "REVISION=$REVISION" >> $GITHUB_ENV

        if [ "$REVISION" == "null" ]; then
          echo "IMPORT FAILED"
          exit 1
        fi

        echo "Imported revision: $REVISION"

    # DEPLOY proxy (FINAL FIX WITH OVERRIDE)
    - name: Deploy proxy
      run: |
        echo "Deploying revision $REVISION to env $APIGEE_ENV"

        curl -X POST \
        "https://apigee.googleapis.com/v1/organizations/$APIGEE_ORG/environments/$APIGEE_ENV/apis/$PROXY_NAME/revisions/$REVISION/deployments?override=true" \
        -H "Authorization: Bearer $TOKEN"

        echo ""
        echo "DEPLOYMENT TRIGGERED"
