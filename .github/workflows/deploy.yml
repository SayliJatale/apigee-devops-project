name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Authenticate to Google Cloud
    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 3️⃣ Set up gcloud SDK
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 4️⃣ Install dependencies (jq for JSON parsing)
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y jq curl unzip

    # 5️⃣ Create ZIP bundle of your proxy (if not already zipped)
    - name: Prepare proxy bundle
      run: |
        if [ ! -f "./apiproxy.zip" ]; then
          echo "Zipping proxy folder..."
          zip -r apiproxy.zip ./apiproxy
        fi

    # 6️⃣ Import API proxy via Apigee Management API
    - name: Import API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        API_NAME="demoapi"

        echo "Getting access token..."
        TOKEN=$(gcloud auth print-access-token)

        echo "Uploading API bundle via REST API..."
        IMPORT_RESPONSE=$(curl -s -X POST \
          -H "Authorization: Bearer $TOKEN" \
          -F "file=@./apiproxy.zip" \
          "https://apigee.googleapis.com/v1/organizations/$ORG/apis?action=import")

        echo "Import response: $IMPORT_RESPONSE"

        # Extract the revision number from response
        REVISION=$(echo $IMPORT_RESPONSE | jq -r '.revision')
        if [ -z "$REVISION" ] || [ "$REVISION" == "null" ]; then
          echo "Error: Failed to detect revision from import."
          exit 1
        fi
        echo "Imported revision: $REVISION"
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    # 7️⃣ Deploy the latest revision using gcloud
    - name: Deploy API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        ENV="${{ secrets.APIGEE_ENV }}"
        API_NAME="demoapi"

        echo "Deploying revision $REVISION to environment $ENV..."
        gcloud apigee apis deploy "$REVISION" \
          --api="$API_NAME" \
          --organization="$ORG" \
          --environment="$ENV" \
          --override

        echo "Deployment complete!"
