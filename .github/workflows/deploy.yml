name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Authenticate to Google Cloud
    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 3️⃣ Set up gcloud SDK
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 4️⃣ Install dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y jq curl unzip

    # 5️⃣ Install apigeecli
    - name: Install apigeecli
      run: |
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        chmod +x download.sh
        ./download.sh
        echo "$HOME/.apigeecli/bin" >> $GITHUB_PATH

    # 6️⃣ Import API proxy directly from folder
    - name: Import API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        API_NAME="demoapi"

        echo "Getting access token..."
        TOKEN=$(gcloud auth print-access-token)

        echo "Importing API proxy via apigeecli..."
        IMPORT_RESPONSE=$(apigeecli apis import -f ./apiproxy -o "$ORG" -t "$TOKEN")
        echo "$IMPORT_RESPONSE"

        # Extract revision number
        REVISION=$(echo "$IMPORT_RESPONSE" | jq -r '.revision')
        if [ -z "$REVISION" ] || [ "$REVISION" == "null" ]; then
          echo "❌ Failed to detect revision from import. Check proxy bundle for errors."
          exit 1
        fi

        echo "✅ Imported revision: $REVISION"
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    # 7️⃣ Deploy API proxy
    - name: Deploy API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        ENV="${{ secrets.APIGEE_ENV }}"
        API_NAME="demoapi"

        if [ -z "$REVISION" ] || [ "$REVISION" == "null" ]; then
          echo "❌ REVISION not set. Cannot deploy."
          exit 1
        fi

        echo "Deploying revision $REVISION to environment $ENV..."
        apigeecli apis deploy -n "$API_NAME" -e "$ENV" -o "$ORG" -v "$REVISION" -t "$(gcloud auth print-access-token)" --ovr

        echo "✅ Deployment complete!"
