name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Authenticate to Google Cloud
    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 3️⃣ Set up gcloud SDK
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 4️⃣ Install dependencies (jq for JSON parsing)
    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    # 5️⃣ Import API proxy
    - name: Import API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        echo "Importing API proxy..."
        gcloud apigee apis import ./apiproxy \
          --organization="$ORG"

    # 6️⃣ Detect latest revision
    - name: Get latest revision
      id: get-revision
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        API_NAME="demoapi"

        REVISION=$(gcloud apigee apis list --organization="$ORG" --format=json \
          | jq -r ".[] | select(.name==\"$API_NAME\") | .latestRevision")

        if [ -z "$REVISION" ] || [ "$REVISION" == "null" ]; then
          echo "Error: Could not detect latest revision."
          exit 1
        fi

        echo "Latest revision detected: $REVISION"
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    # 7️⃣ Deploy API proxy
    - name: Deploy API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        ENV="${{ secrets.APIGEE_ENV }}"
        API_NAME="demoapi"

        echo "Deploying revision $REVISION to environment $ENV..."
        gcloud apigee apis deploy "$REVISION" \
          --organization="$ORG" \
          --environment="$ENV"

        echo "Deployment complete!"
