name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Authenticate to Google Cloud
    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 3️⃣ Set up gcloud SDK
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 4️⃣ Install dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y jq curl unzip zip

    # 5️⃣ Install Apigee CLI
    - name: Install Apigee CLI
      run: |
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        chmod +x download.sh
        ./download.sh
        export PATH=$PATH:$HOME/.apigeecli/bin
        echo "Apigee CLI version:"
        apigeecli version || true

    # 6️⃣ Validate proxy folder (not zip)
    - name: Validate API proxy folder
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        echo "Validating API proxy folder..."
        VALIDATE_OUTPUT=$(apigeecli apis validate -f ./apiproxy -o $ORG --default-token 2>&1 || true)
        echo "$VALIDATE_OUTPUT"
        if echo "$VALIDATE_OUTPUT" | grep -i "error"; then
          echo "❌ Proxy bundle validation failed"
          exit 1
        fi
        echo "✅ Proxy folder is valid"

    # 7️⃣ Import API proxy via Apigee CLI (zip)
    - name: Import API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        API_NAME="demoapi"

        echo "Zipping proxy folder..."
        zip -r apiproxy.zip ./apiproxy

        echo "Importing API proxy..."
        IMPORT_RESPONSE=$(apigeecli apis import -f ./apiproxy.zip -o $ORG --default-token 2>&1 || true)
        echo "Raw import response:"
        echo "$IMPORT_RESPONSE"

        REVISION=$(echo "$IMPORT_RESPONSE" | jq -r '.revision // empty')
        if [ -z "$REVISION" ]; then
          echo "❌ Failed to detect revision from import."
          exit 1
        fi

        echo "Imported revision: $REVISION"
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    # 8️⃣ Deploy API proxy via REST API
    - name: Deploy API proxy via REST API
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        ENV="${{ secrets.APIGEE_ENV }}"
        API_NAME="demoapi"

        if [ -z "$REVISION" ]; then
          echo "Error: REVISION is not set. Cannot deploy."
          exit 1
        fi

        echo "Getting access token..."
        TOKEN=$(gcloud auth print-access-token)

        echo "Deploying revision $REVISION to environment $ENV..."
        DEPLOY_RESPONSE=$(curl -s -X POST \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          "https://apigee.googleapis.com/v1/organizations/$ORG/environments/$ENV/apis/$API_NAME/revisions/$REVISION/deployments" \
          -d '{}')

        echo "Deploy response:"
        echo "$DEPLOY_RESPONSE"

        if echo "$DEPLOY_RESPONSE" | grep -i "error"; then
          echo "❌ Deployment failed!"
          exit 1
        fi

        echo "✅ Deployment completed successfully!"
