name: Apigee Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip zip jq

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT }}

    - name: Install apigeecli
      run: |
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o dl.sh
        bash dl.sh
        echo "$HOME/.apigeecli/bin" >> $GITHUB_PATH

    - name: Verify
      run: |
        which apigeecli
        apigeecli --help

    # IMPORTANT ZIP STEP
    - name: Create proxy bundle
      run: |
        echo "Creating bundle..."
        cd apiproxies
        zip -r demoapi.zip demoapi
        mkdir ../bundle
        mv demoapi.zip ../bundle/
        cd ..

    - name: Import proxy
      env:
        ORG: ${{ secrets.APIGEE_ORG }}
      run: |
        TOKEN=$(gcloud auth print-access-token)

        apigeecli apis import \
          -f bundle \
          -o $ORG \
          -t $TOKEN

    - name: Deploy proxy
      env:
        ORG: ${{ secrets.APIGEE_ORG }}
        ENV: ${{ secrets.APIGEE_ENV }}
      run: |
        TOKEN=$(gcloud auth print-access-token)

        apigeecli apis deploy \
          -n demoapi \
          -o $ORG \
          -e $ENV \
          -t $TOKEN \
          --ovr
