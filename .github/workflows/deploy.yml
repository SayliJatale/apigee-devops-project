name: Apigee X Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout code
    - name: Checkout
      uses: actions/checkout@v4

    # Authenticate GCP
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    # Create correct Apigee bundle
    - name: Create proxy bundle
      run: |
        echo "Creating Apigee bundle..."

        mkdir build
        mkdir build/apiproxy

        cp -r apiproxies/demoapi/* build/apiproxy/

        cd build
        zip -r demoapi.zip apiproxy

        mkdir -p $GITHUB_WORKSPACE/bundle
        mv demoapi.zip $GITHUB_WORKSPACE/bundle/

        echo "Bundle ready"

    # Get access token
    - name: Get token
      run: |
        TOKEN=$(gcloud auth print-access-token)
        echo "TOKEN=$TOKEN" >> $GITHUB_ENV

    # Import proxy
    - name: Import proxy
      run: |
        echo "Importing proxy..."

        RESPONSE=$(curl -s -X POST \
        "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/apis?action=import&name=demoapi" \
        -H "Authorization: Bearer $TOKEN" \
        -H "Content-Type: multipart/form-data" \
        -F "file=@bundle/demoapi.zip")

        echo "====== RESPONSE ======"
        echo "$RESPONSE"

        REVISION=$(echo "$RESPONSE" | grep -o '"revision":[0-9]*' | grep -o '[0-9]*')

        if [ -z "$REVISION" ]; then
          echo "IMPORT FAILED"
          exit 1
        fi

        echo "Revision: $REVISION"
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    # Deploy proxy
    - name: Deploy proxy
      run: |
        echo "Deploying revision $REVISION"

        curl -X POST \
        "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/environments/${{ secrets.APIGEE_ENV }}/apis/demoapi/revisions/$REVISION/deployments" \
        -H "Authorization: Bearer $TOKEN"

        echo "DEPLOY DONE"
