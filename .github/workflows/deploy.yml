name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Authenticate to Google Cloud
    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 3️⃣ Set up gcloud SDK
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 4️⃣ Install dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y jq curl unzip zip

    # 5️⃣ Install apigeecli
    - name: Install apigeecli
      run: |
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        chmod +x download.sh
        ./download.sh
        echo "$HOME/.apigeecli/bin" >> $GITHUB_PATH

    # 6️⃣ Prepare proxy zip
    - name: Prepare proxy bundle
      run: |
        if [ ! -f "./apiproxy.zip" ]; then
          echo "Zipping proxy folder..."
          zip -r apiproxy.zip ./apiproxy
        fi

    # 7️⃣ Import API proxy
    - name: Import API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        API_NAME="demoapi"

        echo "Getting access token..."
        TOKEN=$(gcloud auth print-access-token)

        echo "Importing API proxy via apigeecli..."
        IMPORT_RESPONSE=$(apigeecli apis import -f ./apiproxy.zip -o "$ORG" -t "$TOKEN")
        echo "$IMPORT_RESPONSE"

        # Extract revision number
        REVISION=$(echo "$IMPORT_RESPONSE" | jq -r '.revision')
        if [ -z "$REVISION" ] || [ "$REVISION" == "null" ]; then
          echo "❌ Failed to detect revision from import. Check proxy bundle for errors."
          exit 1
        fi
        echo "Imported revision: $REVISION"
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    # 8️⃣ Deploy API proxy via REST API
    - name: Deploy API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        ENV="${{ secrets.APIGEE_ENV }}"
        API_NAME="demoapi"
        REVISION="${{ env.REVISION }}"

        echo "Getting access token..."
        TOKEN=$(gcloud auth print-access-token)

        echo "Deploying revision $REVISION to environment $ENV via REST API..."
        DEPLOY_RESPONSE=$(curl -s -X POST \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{}' \
          "https://apigee.googleapis.com/v1/organizations/$ORG/environments/$ENV/apis/$API_NAME/revisions/$REVISION/deployments")

        echo "$DEPLOY_RESPONSE"

        if echo "$DEPLOY_RESPONSE" | jq -e '.error' >/dev/null; then
          echo "❌ Deployment failed!"
          exit 1
        fi

        echo "✅ Deployment successful!"
