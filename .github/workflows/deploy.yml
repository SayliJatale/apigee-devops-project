name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    # ✅ Install all dependencies including xmllint
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl unzip zip libxml2-utils

    # ✅ Install Apigee CLI
    - name: Install Apigee CLI
      run: |
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        chmod +x download.sh
        ./download.sh
        echo "$HOME/.apigeecli/bin" >> $GITHUB_PATH

    # ✅ Validate XML & create zip bundle
    - name: Prepare API proxy
      run: |
        API_NAME="demoapi"
        API_FOLDER="$GITHUB_WORKSPACE/apiproxies/$API_NAME"
        ZIP_FILE="$GITHUB_WORKSPACE/$API_NAME.zip"

        echo "=============================="
        echo "Processing API proxy: $API_NAME"
        echo "=============================="

        echo "Checking contents of API folder..."
        ls -R "$API_FOLDER"

        echo "Validating XML files..."
        find "$API_FOLDER" -name "*.xml" -exec xmllint --noout {} \;
        echo "All XML files are valid."

        echo "Zipping API proxy folder..."
        # Important: zip contents relative to folder, not including full path
        cd "$API_FOLDER"
        zip -r -q "$ZIP_FILE" ./*

        echo "Contents of zip:"
        unzip -l "$ZIP_FILE"

    # ✅ Import API proxy
    - name: Import API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        TOKEN=$(gcloud auth print-access-token)
        ZIP_FILE="$GITHUB_WORKSPACE/demoapi.zip"

        echo "Importing API proxy via Apigee CLI..."
        IMPORT_OUTPUT=$(apigeecli apis import -f "$ZIP_FILE" --org "$ORG" --token "$TOKEN" 2>&1) || true

        echo "Raw import output:"
        echo "$IMPORT_OUTPUT"

        REVISION=$(echo "$IMPORT_OUTPUT" | jq -r '.revision // empty')
        if [ -z "$REVISION" ]; then
          echo "❌ Import failed! Check zip contents or raw output above."
          exit 1
        fi

        echo "✅ Imported revision: $REVISION"
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    # ✅ Deploy API proxy
    - name: Deploy API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        ENV="${{ secrets.APIGEE_ENV }}"
        API_NAME="demoapi"

        if [ -z "$REVISION" ]; then
          echo "❌ Error: REVISION is not set. Cannot deploy."
          exit 1
        fi

        echo "Deploying revision $REVISION to environment $ENV..."
        DEPLOY_OUTPUT=$(apigeecli apis deploy --name "$API_NAME" --rev "$REVISION" --env "$ENV" --org "$ORG" --token "$(gcloud auth print-access-token)" 2>&1) || true

        echo "Deployment output:"
        echo "$DEPLOY_OUTPUT"

        if echo "$DEPLOY_OUTPUT" | grep -qi "error"; then
          echo "❌ Deployment failed!"
          exit 1
        fi

        echo "✅ Deployment complete!"
