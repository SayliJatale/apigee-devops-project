name: Apigee X CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 🔐 Authenticate GCP
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 📦 Create bundle from apiproxies/demoapi
    - name: Create proxy bundle zip
      run: |
        echo "Zipping proxy from apiproxies/demoapi"
        cd apiproxies/demoapi
        zip -r demoapi.zip .
        mkdir -p $GITHUB_WORKSPACE/bundle
        mv demoapi.zip $GITHUB_WORKSPACE/bundle/
        echo "Bundle created"

    # 🔑 Get access token
    - name: Get access token
      run: |
        TOKEN=$(gcloud auth print-access-token)
        echo "TOKEN=$TOKEN" >> $GITHUB_ENV

    # ⬆️ Import proxy
    - name: Import proxy to Apigee
      run: |
        RESPONSE=$(curl -s -X POST \
        "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/apis?action=import&name=demoapi" \
        -H "Authorization: Bearer $TOKEN" \
        -H "Content-Type: multipart/form-data" \
        -F "file=@bundle/demoapi.zip")

        echo $RESPONSE
        REVISION=$(echo $RESPONSE | jq -r '.revision')
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    # 🚀 Deploy proxy
    - name: Deploy proxy
      run: |
        curl -X POST \
        "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/environments/${{ secrets.APIGEE_ENV }}/apis/demoapi/revisions/${{ env.REVISION }}/deployments" \
        -H "Authorization: Bearer $TOKEN"
