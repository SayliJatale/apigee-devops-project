name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y jq curl unzip zip

    - name: Prepare proxy bundle
      run: |
        if [ ! -f "./apiproxy.zip" ]; then
          zip -r apiproxy.zip ./apiproxy
        fi

    - name: Import API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        API_NAME="demoapi"
        TOKEN=$(gcloud auth print-access-token)

        IMPORT_RESPONSE=$(curl -s -X POST \
          -H "Authorization: Bearer $TOKEN" \
          -F "file=@./apiproxy.zip" \
          "https://apigee.googleapis.com/v1/organizations/$ORG/apis?action=import&name=$API_NAME")

        echo "Import response: $IMPORT_RESPONSE"

        REVISION=$(echo "$IMPORT_RESPONSE" | jq -r '.revision')
        if [ -z "$REVISION" ] || [ "$REVISION" == "null" ]; then
          echo "Error: revision not extracted"
          exit 1
        fi

        echo "REVISION=$REVISION" >> $GITHUB_ENV

    - name: Deploy API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        ENV="${{ secrets.APIGEE_ENV }}"
        API_NAME="demoapi"

        echo "Deploying revision $REVISION to $ENV"
        gcloud apigee apis deploy "$REVISION" \
          --api="$API_NAME" \
          --environment="$ENV" \
          --organization="$ORG" \
          --override
