name: Deploy to Apigee X

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: YOUR_GCP_PROJECT
  APIGEE_ENV: eval
  APIGEE_API: demoapi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 🔐 Auth
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 🔎 Find apiproxy automatically
    - name: Locate apiproxy folder
      run: |
        echo "Searching apiproxy folder..."
        APIPROXY_PATH=$(find . -type d -name apiproxy | head -n 1)

        if [ -z "$APIPROXY_PATH" ]; then
          echo "❌ ERROR: apiproxy folder not found in repo"
          exit 1
        fi

        echo "Found apiproxy at: $APIPROXY_PATH"
        echo "APIPROXY_PATH=$APIPROXY_PATH" >> $GITHUB_ENV

    # 📦 Zip bundle
    - name: Zip proxy bundle
      run: |
        cd "$APIPROXY_PATH"
        zip -r ../../proxy.zip .
        cd ../..

    # 🚀 Import proxy
    - name: Import API proxy
      run: |
        TOKEN=$(gcloud auth print-access-token)

        echo "Importing proxy..."
        curl -X POST \
        "https://apigee.googleapis.com/v1/organizations/$PROJECT_ID/apis?action=import&name=$APIGEE_API" \
        -H "Authorization: Bearer $TOKEN" \
        -H "Content-Type: multipart/form-data" \
        -F "file=@proxy.zip" \
        -o response.json

        cat response.json

        REVISION=$(cat response.json | jq -r '.revision')

        if [ "$REVISION" = "null" ]; then
          echo "❌ IMPORT FAILED"
          exit 1
        fi

        echo "REVISION=$REVISION" >> $GITHUB_ENV
        echo "Imported revision: $REVISION"

    # 🚀 Deploy
    - name: Deploy to Apigee env
      run: |
        TOKEN=$(gcloud auth print-access-token)

        echo "Deploying revision $REVISION..."

        curl -X POST \
        "https://apigee.googleapis.com/v1/organizations/$PROJECT_ID/environments/$APIGEE_ENV/apis/$APIGEE_API/revisions/$REVISION/deployments?override=true" \
        -H "Authorization: Bearer $TOKEN"

        echo "✅ DEPLOYMENT DONE"
