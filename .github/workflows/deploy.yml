name: Apigee CI/CD

on:
  push:
    branches:
      - main

env:
  API_PROXY_NAME: demoapi        # Name of your API proxy folder
  ORG: your-apigee-org           # Apigee org name
  ENV: test                      # Target Apigee environment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl unzip zip libxml2-utils

      - name: Download and setup Apigee CLI
        run: |
          curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
          bash download.sh
          export PATH=$PATH:$HOME/.apigeecli/bin

      - name: Setup gcloud with Service Account
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Validate API proxy XMLs
        run: |
          echo "Validating XML files..."
          find apiproxies/${{ env.API_PROXY_NAME }} -name "*.xml" -exec xmllint --noout {} \;

      - name: Zip API proxy contents
        run: |
          echo "Zipping API proxy contents..."
          cd apiproxies
          zip -r ../${{ env.API_PROXY_NAME }}.zip ${{ env.API_PROXY_NAME }}

      - name: Import API proxy
        run: |
          echo "Importing API proxy via Apigee CLI..."
          apigeecli apis import -f ${{ env.API_PROXY_NAME }}.zip -o ${{ env.ORG }} --default-token

      - name: Deploy API proxy
        run: |
          echo "Deploying API proxy to environment ${{ env.ENV }}..."
          apigeecli apis deploy -n ${{ env.API_PROXY_NAME }} -o ${{ env.ORG }} -e ${{ env.ENV }} --default-token -d

      - name: Show deployed revision
        run: |
          echo "Listing revisions..."
          apigeecli apis revisions -n ${{ env.API_PROXY_NAME }} -o ${{ env.ORG }} --default-token
