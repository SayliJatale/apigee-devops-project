name: Apigee CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl unzip zip libxml2-utils

    ###########################################################
    # 🔐 AUTHENTICATE TO GOOGLE CLOUD (MOST IMPORTANT)
    ###########################################################
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Setup gcloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    ###########################################################
    # Install Apigee CLI
    ###########################################################
    - name: Install Apigee CLI
      run: |
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        bash download.sh
        echo "$HOME/.apigeecli/bin" >> $GITHUB_PATH

    ###########################################################
    # Validate XML
    ###########################################################
    - name: Validate XML
      run: |
        echo "Validating XML..."
        find apiproxies/demoapi -name "*.xml" -exec xmllint --noout {} \;

    ###########################################################
    # Zip proxy
    ###########################################################
    - name: Zip API proxy
      run: |
        cd apiproxies
        zip -r ../demoapi.zip demoapi -x "*/.*"
        cd ..
        ls -l

    ###########################################################
    # Import proxy
    ###########################################################
    - name: Import API proxy
      env:
        ORG: ${{ secrets.APIGEE_ORG }}
        ENV: ${{ secrets.APIGEE_ENV }}
      run: |
        echo "Getting token..."
        TOKEN=$(gcloud auth print-access-token)

        echo "Importing proxy..."
        apigeecli apis import \
          -f demoapi.zip \
          -o $ORG \
          -t $TOKEN

    ###########################################################
    # Deploy proxy
    ###########################################################
    - name: Deploy API proxy
      env:
        ORG: ${{ secrets.APIGEE_ORG }}
        ENV: ${{ secrets.APIGEE_ENV }}
      run: |
        TOKEN=$(gcloud auth print-access-token)

        apigeecli apis deploy \
          -n demoapi \
          -o $ORG \
          -e $ENV \
          -t $TOKEN
