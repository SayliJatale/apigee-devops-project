name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Authenticate to Google Cloud
    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 3️⃣ Set up gcloud SDK
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 4️⃣ Install dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl unzip zip

    # 5️⃣ Download Apigee CLI
    - name: Download Apigee CLI
      run: |
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        chmod +x download.sh
        ./
