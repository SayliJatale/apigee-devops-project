name: Apigee CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Install tools
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq unzip zip curl libxml2-utils

    # Authenticate to Google Cloud
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # Setup gcloud
    - name: Setup gcloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    # Activate service account & set project
    - name: Activate Service Account
      run: |
        echo "Activating service account..."
        gcloud auth activate-service-account --key-file=$GOOGLE_APPLICATION_CREDENTIALS

        echo "Setting project..."
        gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"

        echo "Auth list:"
        gcloud auth list
        echo "Config list:"
        gcloud config list

    # Install Apigee CLI
    - name: Install Apigee CLI
      run: |
        echo "Downloading apigeecli..."
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        bash download.sh
        echo "$HOME/.apigeecli/bin" >> $GITHUB_PATH
        export PATH=$PATH:$HOME/.apigeecli/bin
        which apigeecli

    # Validate XML
    - name: Validate XML files
      run: |
        echo "Validating XML..."
        find apiproxies -name "*.xml" -exec xmllint --noout {} \;

    # Zip proxy
    - name: Zip API proxy bundle
      run: |
        echo "Zipping proxy..."
        cd apiproxies
        zip -r ../demoapi.zip demoapi
        cd ..
        echo "Zip created:"
        ls -l

    # Get token
    - name: Get GCP Access Token
      id: token
      run: |
        TOKEN=$(gcloud auth print-access-token)
        echo "token=$TOKEN" >> $GITHUB_OUTPUT

    # Import proxy to Apigee
    - name: Import API proxy
      run: |
        echo "Importing proxy bundle..."
        mkdir bundle
        mv demoapi.zip bundle/

        apigeecli apis import \
          -f bundle \
          -o ${{ secrets.APIGEE_ORG }} \
          -t "${{ steps.token.outputs.token }}"

    # Deploy proxy
    - name: Deploy API proxy
      run: |
        echo "Deploying proxy..."
        apigeecli apis deploy \
          -n demoapi \
          -o ${{ secrets.APIGEE_ORG }} \
          -e ${{ secrets.APIGEE_ENV }} \
          -t "${{ steps.token.outputs.token }}"
