name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Authenticate to Google Cloud
    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 3️⃣ Set up gcloud SDK
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 4️⃣ Install dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl unzip zip libxml2-utils

    # 5️⃣ Install Apigee CLI
    - name: Install Apigee CLI
      run: |
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        chmod +x download.sh
        ./download.sh
        echo "$HOME/.apigeecli/bin" >> $GITHUB_PATH

    # 6️⃣ Prepare API proxy zip
    - name: Prepare API proxy zip
      run: |
        API_NAME="demoapi"
        API_FOLDER="$GITHUB_WORKSPACE/apiproxies/$API_NAME"
        ZIP_FILE="$GITHUB_WORKSPACE/${API_NAME}.zip"

        echo "Checking contents of API folder..."
        ls -R "$API_FOLDER"

        # Validate all XML files
        echo "Validating XML files..."
        find "$API_FOLDER" -name '*.xml' -exec xmllint --noout {} \;

        # Zip contents (must zip the folder contents, not the folder itself!)
        cd "$API_FOLDER"
        zip -r "$ZIP_FILE" ./*

        echo "Contents of zip file:"
        unzip -l "$ZIP_FILE"

        echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV

    # 7️⃣ Import API proxy via Apigee CLI
    - name: Import API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        TOKEN=$(gcloud auth print-access-token)
        echo "Importing API proxy via Apigee CLI..."
        IMPORT_RESPONSE=$(apigeecli apis import -f "$ZIP_FILE" --org "$ORG" --token "$TOKEN" 2>&1 || true)
        echo "Import response:"
        echo "$IMPORT_RESPONSE"

        # Extract revision safely
        REVISION=$(echo "$IMPORT_RESPONSE" | jq -r '.revision // empty')
        if [ -z "$REVISION" ]; then
          echo "❌ Error: Failed to detect revision from import. Check proxy bundle contents."
          exit 1
        fi

        echo "Imported revision: $REVISION"
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    # 8️⃣ Deploy API proxy via Apigee CLI
    - name: Deploy API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        ENV="${{ secrets.APIGEE_ENV }}"
        API_NAME="demoapi"

        if [ -z "$REVISION" ]; then
          echo "❌ Error: REVISION is not set. Cannot deploy."
          exit 1
        fi

        echo "Deploying revision $REVISION to environment $ENV..."
        DEPLOY_RESPONSE=$(apigeecli apis deploy --name "$API_NAME" --rev "$REVISION" --env "$ENV" --org "$ORG" --token "$(gcloud auth print-access-token)" 2>&1 || true)

        echo "Deploy response:"
        echo "$DEPLOY_RESPONSE"

        if echo "$DEPLOY_RESPONSE" | grep -qi "error"; then
          echo "❌ Deployment failed!"
          exit 1
        fi

        echo "✅ Deployment complete!"
