name: Apigee CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-apigee:
    runs-on: ubuntu-latest
    env:
      ORG: "***"              # Apigee org
      ENV: "test"             # Apigee environment
      API_PROXY_NAME: "demoapi"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl unzip zip libxml2-utils

      - name: Setup gcloud with Service Account
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Download Apigee CLI
        run: |
          curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
          chmod +x download.sh
          ./download.sh
          export PATH=$PATH:$HOME/.apigeecli/bin

      - name: Validate XML files
        run: |
          find apiproxies/${{ env.API_PROXY_NAME }} -name '*.xml' -exec xmllint --noout {} \;
          echo "All XML files are valid."

      - name: Zip API proxy bundle
        run: |
          cd apiproxies
          zip -r ../${{ env.API_PROXY_NAME }}.zip ${{ env.API_PROXY_NAME }} -x "*/.*" 
          cd ..
          echo "Contents of zip:"
          unzip -l ${{ env.API_PROXY_NAME }}.zip

      - name: Get access token
        run: |
          echo "Getting access token..."
          TOKEN=$(gcloud auth print-access-token)
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Import API proxy to Apigee
        run: |
          echo "Importing API proxy via Apigee CLI..."
          apigeecli apis import -f ${{ env.API_PROXY_NAME }}.zip -o ${{ env.ORG }} -t "$TOKEN"

      - name: Deploy API proxy to environment
        run: |
          echo "Deploying API proxy to environment ${{ env.ENV }}..."
          apigeecli apis deploy -n ${{ env.API_PROXY_NAME }} -o ${{ env.ORG }} -e ${{ env.ENV }} -t "$TOKEN" -d
