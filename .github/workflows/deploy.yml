name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Authenticate to Google Cloud
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 3️⃣ Set up gcloud SDK
    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 4️⃣ Install dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl zip unzip

    # 5️⃣ Prepare API proxy bundle
    - name: Zip API proxy
      run: |
        if [ ! -f "./apiproxy.zip" ]; then
          echo "Zipping API proxy folder..."
          zip -r apiproxy.zip ./apiproxy
        fi

    # 6️⃣ Validate API proxy bundle
    - name: Validate API proxy
      run: |
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        chmod +x download.sh
        ./download.sh
        export PATH=$PATH:$HOME/.apigeecli/bin

        echo "Validating API proxy bundle..."
        apigeecli apis validate -f ./apiproxy.zip || { echo "❌ Proxy bundle validation failed"; exit 1; }
        echo "✅ Proxy bundle is valid."

    # 7️⃣ Import API proxy via REST API
    - name: Import API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        API_NAME="demoapi"

        echo "Getting access token (impersonate service account)..."
        TOKEN=$(gcloud auth print-access-token --impersonate-service-account=apigee-cicd@gcp-project-457715.iam.gserviceaccount.com)

        echo "Uploading API bundle via REST API..."
        IMPORT_RESPONSE=$(curl -s -X POST \
          -H "Authorization: Bearer $TOKEN" \
          -F "file=@./apiproxy.zip" \
          "https://apigee.googleapis.com/v1/organizations/$ORG/apis?action=import&name=$API_NAME")

        echo "Import response: $IMPORT_RESPONSE"

        # Extract revision number
        REVISION=$(echo "$IMPORT_RESPONSE" | jq -r '.revision')
        if [ -z "$REVISION" ] || [ "$REVISION" == "null" ]; then
          echo "❌ Failed to detect revision from import."
          exit 1
        fi

        echo "✅ Imported revision: $REVISION"
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    # 8️⃣ Deploy API proxy via REST API
    - name: Deploy API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        ENV="${{ secrets.APIGEE_ENV }}"
        API_NAME="demoapi"

        echo "Deploying revision $REVISION to environment $ENV..."
        TOKEN=$(gcloud auth print-access-token --impersonate-service-account=apigee-cicd@gcp-project-457715.iam.gserviceaccount.com)

        DEPLOY_RESPONSE=$(curl -s -X POST \
          -H "Authorization: Bearer $TOKEN" \
          "https://apigee.googleapis.com/v1/organizations/$ORG/environments/$ENV/apis/$API_NAME/revisions/$REVISION/deployments")

        echo "Deploy response: $DEPLOY_RESPONSE"

        if echo "$DEPLOY_RESPONSE" | jq -e '.error' >/dev/null; then
          echo "❌ Deployment failed! Check that the service account has proper roles and that the proxy bundle is valid."
          exit 1
        fi

        echo "✅ Deployment complete!"
