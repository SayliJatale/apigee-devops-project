name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Authenticate to Google Cloud
    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 3️⃣ Set up gcloud SDK
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 4️⃣ Install dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl unzip zip libxml2-utils

    # 5️⃣ Install Apigee CLI
    - name: Install Apigee CLI
      run: |
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        chmod +x download.sh
        ./download.sh
        echo "$HOME/.apigeecli/bin" >> $GITHUB_PATH

    # 6️⃣ Import & Deploy all API proxies under apiproxies/
    - name: Import, Validate & Deploy API Proxies
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        ENV="${{ secrets.APIGEE_ENV }}"
        PROXIES_DIR="$GITHUB_WORKSPACE/apiproxies"

        if [ ! -d "$PROXIES_DIR" ]; then
          echo "❌ No apiproxies folder found at $PROXIES_DIR"
          exit 1
        fi

        for API_FOLDER in "$PROXIES_DIR"/*; do
          if [ -d "$API_FOLDER" ]; then
            API_NAME=$(basename "$API_FOLDER")
            echo "============================="
            echo "Processing API proxy: $API_NAME"
            echo "============================="

            # Validate folder structure
            if [ ! -f "$API_FOLDER/apiproxy.xml" ]; then
              echo "❌ Missing apiproxy.xml in $API_FOLDER"
              exit 1
            fi
            for sub in policies proxies targets; do
              if [ ! -d "$API_FOLDER/$sub" ]; then
                echo "❌ Missing $sub folder in $API_FOLDER"
                exit 1
              fi
            done

            # ✅ XML validation
            echo "Validating XML files in $API_NAME..."
            find "$API_FOLDER" -type f -name "*.xml" | while read xmlfile; do
              xmllint --noout "$xmlfile" || { echo "❌ XML validation failed: $xmlfile"; exit 1; }
            done
            echo "All XML files are valid."

            # Get access token
            TOKEN=$(gcloud auth print-access-token)

            # Import API proxy
            echo "Importing API proxy $API_NAME..."
            IMPORT_RESPONSE=$(apigeecli apis import -f "$API_FOLDER" --org "$ORG" --token "$TOKEN" 2>&1 || true)
            echo "$IMPORT_RESPONSE"

            # Extract revision safely
            REVISION=$(echo "$IMPORT_RESPONSE" | grep -oP 'Revision: \K[0-9]+')
            if [ -z "$REVISION" ]; then
              echo "❌ Failed to detect revision from import for $API_NAME"
              exit 1
            fi
            echo "Imported revision $REVISION for $API_NAME"
            echo "REVISION_$API_NAME=$REVISION" >> $GITHUB_ENV

            # Deploy API proxy
            echo "Deploying revision $REVISION of $API_NAME to environment $ENV..."
            DEPLOY_RESPONSE=$(apigeecli apis deploy --name "$API_NAME" --rev "$REVISION" --env "$ENV" --org "$ORG" --token "$TOKEN" 2>&1 || true)
            echo "$DEPLOY_RESPONSE"

            if echo "$DEPLOY_RESPONSE" | grep -qi "error"; then
              echo "❌ Deployment failed for $API_NAME!"
              exit 1
            fi

            echo "✅ Deployment of $API_NAME complete!"
          fi
        done
