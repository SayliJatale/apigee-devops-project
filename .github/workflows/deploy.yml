name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Authenticate to GCP
    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 🔥 IMPORTANT — correct zip creation
    - name: Create proxy bundle
      run: |
        echo "Creating Apigee bundle correctly"
        cd apiproxies/demoapi/apiproxy
        zip -r demoapi.zip .
        mkdir -p ../../../bundle
        mv demoapi.zip ../../../bundle/

    # Get token
    - name: Get access token
      id: token
      run: |
        TOKEN=$(gcloud auth print-access-token)
        echo "TOKEN=$TOKEN" >> $GITHUB_ENV

    # Import proxy
    - name: Import proxy to Apigee
      run: |
        curl -X POST "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/apis?action=import&name=demoapi" \
        -H "Authorization: Bearer $TOKEN" \
        -H "Content-Type: multipart/form-data" \
        -F "file=@bundle/demoapi.zip"

    # Deploy proxy
    - name: Deploy to environment
      run: |
        curl -X POST "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/environments/${{ secrets.APIGEE_ENV }}/apis/demoapi/revisions/1/deployments" \
        -H "Authorization: Bearer $TOKEN"
