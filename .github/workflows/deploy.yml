name: Apigee CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    # Authenticate to GCP (THIS creates creds)
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # Setup gcloud CLI
    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    # IMPORTANT: activate service account for gcloud commands
    - name: Activate service account
      run: |
        gcloud auth activate-service-account --key-file=$GOOGLE_APPLICATION_CREDENTIALS
        gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
        gcloud auth list

    # Install tools
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq unzip zip curl libxml2-utils

    # Install Apigee CLI
    - name: Install Apigee CLI
      run: |
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        bash download.sh
        echo "$HOME/.apigeecli/bin" >> $GITHUB_PATH

    # Validate XML
    - name: Validate proxy XML
      run: |
        echo "Validating XML..."
        find apiproxies/demoapi -name "*.xml" -exec xmllint --noout {} \;

    # Zip proxy bundle
    - name: Zip proxy bundle
      run: |
        echo "Zipping proxy..."
        cd apiproxies/demoapi
        zip -r ../../demoapi.zip . -x "*.DS_Store"
        cd ../../
        ls -lh demoapi.zip

    # Import proxy
    - name: Import API proxy
      env:
        ORG: ${{ secrets.APIGEE_ORG }}
      run: |
        echo "Getting token..."
        TOKEN=$(gcloud auth print-access-token)

        echo "Importing proxy..."
        apigeecli apis import \
          -f . \
          -o $ORG \
          -t $TOKEN

    # Deploy proxy
    - name: Deploy API proxy
      env:
        ORG: ${{ secrets.APIGEE_ORG }}
        ENV: ${{ secrets.APIGEE_ENV }}
      run: |
        TOKEN=$(gcloud auth print-access-token)

        echo "Deploying proxy..."
        apigeecli apis deploy \
          -n demoapi \
          -o $ORG \
          -e $ENV \
          -t $TOKEN
