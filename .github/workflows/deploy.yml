name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Authenticate to Google Cloud
    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 3️⃣ Set up gcloud SDK
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 4️⃣ Install dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl unzip zip libxml2-utils

    # 5️⃣ Download Apigee CLI
    - name: Download apigeecli
      run: |
        curl -sL https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        chmod +x download.sh
        ./download.sh
        export PATH=$PATH:$HOME/.apigeecli/bin

    # 6️⃣ Prepare proxy bundle
    - name: Zip API proxy
      run: |
        API_FOLDER="$GITHUB_WORKSPACE/apiproxies/demoapi"
        echo "Checking contents of API folder..."
        ls -R "$API_FOLDER"

        echo "Zipping proxy folder..."
        zip -r apiproxy.zip "$API_FOLDER"/*

    # 7️⃣ Import API proxy via apigeecli
    - name: Import API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        API_FOLDER="$GITHUB_WORKSPACE/apiproxies/demoapi"

        echo "Getting access token..."
        TOKEN=$(gcloud auth print-access-token)

        echo "Importing API proxy via apigeecli..."
        IMPORT_RESPONSE=$(apigeecli apis import --folder "$API_FOLDER" --org "$ORG" --token "$TOKEN" 2>&1 || true)

        echo "Import response:"
        echo "$IMPORT_RESPONSE"

        # Extract revision safely
        REVISION=$(echo "$IMPORT_RESPONSE" | jq -r '.revision // empty')
        if [ -z "$REVISION" ]; then
          echo "❌ Error: Failed to detect revision from import. Check proxy bundle contents."
          exit 1
        fi

        echo "Imported revision: $REVISION"
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    # 8️⃣ Deploy API proxy
    - name: Deploy API proxy
      run: |
        ORG="${{ secrets.APIGEE_ORG }}"
        ENV="${{ secrets.APIGEE_ENV }}"
        API_NAME="demoapi"

        if [ -z "$REVISION" ]; then
          echo "❌ Error: REVISION is not set. Cannot deploy."
          exit 1
        fi

        echo "Deploying revision $REVISION to environment $ENV..."
        gcloud apigee apis deploy "$REVISION" \
          --api="$API_NAME" \
          --environment="$ENV" \
          --organization="$ORG" \
          --override

        echo "Deployment complete!"
