name: Apigee CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 🔐 Authenticate to Google Cloud
    - name: Auth to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    # 🚀 Install apigeecli
    - name: Install apigeecli
      run: |
        curl -L https://raw.githubusercontent.com/apigee/apigeecli/main/downloadLatest.sh -o download.sh
        chmod +x download.sh
        ./download.sh

        echo "$HOME/.apigeecli/bin" >> $GITHUB_PATH

    # 🚀 Deploy proxy
    - name: Deploy to Apigee
      run: |
        TOKEN=$(gcloud auth print-access-token)

        echo "Uploading bundle..."
        apigeecli apis create bundle \
          -f ./apiproxy \
          -n demoapi \
          -o ${{ secrets.APIGEE_ORG }} \
          -t $TOKEN

        echo "Deploying latest revision..."
        apigeecli apis deploy \
          -n demoapi \
          -e ${{ secrets.APIGEE_ENV }} \
          -o ${{ secrets.APIGEE_ORG }} \
          -t $TOKEN
